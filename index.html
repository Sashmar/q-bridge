<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Bridge | Quantum Intelligence</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* --- SAME STYLING AS BEFORE --- */
        :root {
            --bg: #030712;
            --card-bg: rgba(31, 41, 55, 0.4);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-top: 3rem;
            font-size: 2.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            width: 90%;
            max-width: 1000px;
            margin-top: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(12px);
        }

        button {
            background: var(--text-main);
            color: var(--bg);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.2s;
        }

        button:hover {
            background: var(--accent);
            transform: scale(1.02);
        }

        /* NEW: Input Box Styling */
        textarea {
            width: 100%;
            background: #000;
            color: var(--accent);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            box-sizing: border-box;
            /* Fixes padding issues */
            margin-bottom: 10px;
            height: 80px;
        }

        .console {
            background: #000;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            font-family: 'JetBrains Mono', monospace;
            color: #4ade80;
            min-height: 60px;
            white-space: pre-wrap;
            font-size: 0.85rem;
        }

        #viz {
            height: 250px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            position: relative;
            margin-top: 1rem;
            border: 1px dashed #333;
            overflow: hidden;
        }

        .node {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            color: #fff;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.5s;
            z-index: 2;
        }

        .node-default {
            background: #334155;
            border: 2px solid #475569;
        }

        .group-0 {
            background: rgba(239, 68, 68, 0.8);
            border: 2px solid #ef4444;
            box-shadow: 0 0 10px #ef4444;
        }

        .group-1 {
            background: rgba(59, 130, 246, 0.8);
            border: 2px solid #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
        }

        /* Lines connecting nodes */
        .line {
            position: absolute;
            height: 2px;
            background: #333;
            transform-origin: 0 0;
            z-index: 1;
        }
    </style>
</head>

<body>

    <h1>Q-BRIDGE</h1>

    <div class="container">
        <div class="card">
            <h2>1. Entropy Engine</h2>
            <p>Get a true random number from IBM Cloud.</p>
            <button onclick="getQuantumRandom()">Generate Key</button>
            <div class="console" id="out-rand">Waiting...</div>
        </div>

        <div class="card">
            <h2>2. Custom Logistics Solver</h2>
            <p>Define your network connections below. Format: <code>[[0,1], [1,2]...]</code></p>

            <textarea id="user-input"
                placeholder="Enter routes: [[0,1], [1,2], [2,0]]">[[0,1], [1,2], [2,3], [3,4], [4,0], [0,2]]</textarea>

            <button onclick="runOptimization()" id="btn-opt">Optimize My Route</button>
            <div id="viz"></div>
            <div class="console" id="out-opt">Ready.</div>
        </div>
    </div>

    <script>
        // Only change this if running locally vs cloud
        const API_URL = "";

        async function getQuantumRandom() {
            const out = document.getElementById("out-rand");
            out.innerText = "Connecting to Quantum Core...";
            try {
                const res = await fetch(`/generate-quantum-number`);
                const data = await res.json();
                out.innerText = ">> Success:\n" + JSON.stringify(data.raw_data);
            } catch (e) { out.innerText = "Error connecting to server."; }
        }

        async function runOptimization() {
            const out = document.getElementById("out-opt");
            const viz = document.getElementById("viz");
            const inputVal = document.getElementById("user-input").value;

            // 1. Parse User Input
            let userRoutes;
            try {
                userRoutes = JSON.parse(inputVal);
            } catch (e) {
                out.innerText = "Error: Invalid JSON format. Use [[0,1], [1,2]]";
                return;
            }

            // 2. Clear & Draw Initial Graph
            viz.innerHTML = '';
            out.innerText = "Building graph & optimizing...";

            // Simple logic to scatter nodes in a circle based on how many there are
            const uniqueNodes = new Set(userRoutes.flat());
            const nodeCount = uniqueNodes.size;
            const radius = 80;
            const centerX = viz.offsetWidth / 2;
            const centerY = viz.offsetHeight / 2;

            const nodeCoords = {}; // Store x,y for drawing lines

            Array.from(uniqueNodes).forEach((nodeId, index) => {
                const angle = (index / nodeCount) * 2 * Math.PI;
                const x = centerX + radius * Math.cos(angle) - 15;
                const y = centerY + radius * Math.sin(angle) - 15;

                nodeCoords[nodeId] = { x: x + 15, y: y + 15 }; // Center point

                const div = document.createElement("div");
                div.className = "node node-default";
                div.style.left = x + "px";
                div.style.top = y + "px";
                div.innerText = nodeId;
                div.id = `node-${nodeId}`;
                viz.appendChild(div);
            });

            // Draw Lines (Connections)
            userRoutes.forEach(pair => {
                const p1 = nodeCoords[pair[0]];
                const p2 = nodeCoords[pair[1]];
                if (p1 && p2) drawLine(viz, p1.x, p1.y, p2.x, p2.y);
            });

            // 3. Send to Server
            try {
                const res = await fetch(`/optimize-logistics`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ routes: userRoutes })
                });

                const data = await res.json();
                const resData = data.optimization_result;

                out.innerText = `Optimization Complete! Max Cuts: ${resData.max_cuts}`;

                // Color the nodes
                resData.group_a.forEach(id => {
                    const el = document.getElementById(`node-${id}`);
                    if (el) el.className = "node group-0";
                });
                resData.group_b.forEach(id => {
                    const el = document.getElementById(`node-${id}`);
                    if (el) el.className = "node group-1";
                });

            } catch (e) {
                out.innerText = "Error: Server failed to optimize.";
                console.error(e);
            }
        }

        // Helper to draw lines
        function drawLine(container, x1, y1, x2, y2) {
            const length = Math.sqrt((x1 - x2) ** 2 + (y1 - y2) ** 2);
            const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
            const line = document.createElement("div");
            line.className = "line";
            line.style.width = length + "px";
            line.style.left = x1 + "px";
            line.style.top = y1 + "px";
            line.style.transform = `rotate(${angle}deg)`;
            container.appendChild(line);
        }
    </script>
</body>

</html>
